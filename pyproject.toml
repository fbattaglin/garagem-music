[project]
name = "garagem"
version = "0.1.0"
description = "Multi-agent near-real-time music generation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.9",
    "python-osc>=1.10.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garagem"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Always absolute imports: it makes the architecture test far more reliable.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# Recipes import each other by bare name because `record_cassette.py` puts their own
# directory on the path at load time. Tell mypy the same thing.
mypy_path = "scripts/recipes"
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "live: requires Ableton Live open with AbletonOSC active",
    "slow: long-running test, outside the default suite",
]
