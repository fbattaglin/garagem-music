# "Set as Code" — the Live Set this machine is expected to have open (ADR-013).
#
# `scripts/bootstrap_set.py` compares the open Set against this file. It repairs only
# what the Live API can repair safely: tempo, launch quantisation, track names. Missing
# tracks and missing instruments are reported for a human to fix in Live, because no
# LOM call can load an instrument — a track created from code would receive MIDI
# correctly and make no sound at all.
#
# The Set: ~/Music/Ableton/GARAGEM/garagem-phase1 Project/garagem-band.als
#
# Ableton Live 12 Lite caps a Set at 8 tracks. Four were what Phase 1 needed; ADR-026
# added a fifth, LEAD, so the songwriter has somewhere to put a riff. A Set that still
# has four plays exactly as it did — the writers map instruments through this file, so a
# track that is not here never receives a part. ADR-028 adds an optional sixth, the second
# guitar (role `guitar_double`); a Set without it plays one guitar.
#
# `instrument` is checked by name since ADR-028: some device on the track must be called
# this, or start with it ("Analog Lab" matches Live's "Analog Lab V"). The check used to be only
# that *some* device was present, and the kit drifted from Dry Session to Gen Purpose
# unnoticed. Phase 1 played everything on Drift (ADR-013); ADR-025 gave the band Core
# Library instruments; ADR-028 chooses the sound by ear with `scripts/soundcheck.py`.
#
# The mix, per track, once it is chosen: `volume` (Live's fader, 0.0-1.0, where 0.85 is
# 0 dB), `pan` (-1.0 left to 1.0 right) and `sends` (one level per return track). Made by
# ear in Live, then printed by `scripts/bootstrap_set.py --mix` to paste in here; the
# bootstrap applies it with `--apply`. `palm_mute_below` is the velocity a guitar sampler
# splits palm mute from sustain at, and must match what its instrument is set to.
#
# `armed = false` on every band track (ADR-022). An armed MIDI track plays whatever the
# MiniLab sends, so a cue pad pressed during a jam would sound a note inside the band.
# The bootstrap disarms it with `--apply`.

schema = 1
name = "garagem-phase1"

# 132 BPM: an 8-bar section lasts 14.5 s, which is what the §4.2 deadline is 40% of.
tempo_bpm = 132.0
# Part of the contract, not a preference (ADR-001): with quantisation off, a fired
# scene launches the instant the datagram lands, which is mid-bar and audibly wrong.
quantization = "1_bar"
# The arrangement loop off (`phase-4-findings.md` §8). Clips do not care, but the BarClock
# counts bars from the song position, and with the loop on it goes back before the bar the
# scheduler is waiting for — a song that silently never reaches its second section.
loop = false

[[track]]
index = 0
name = "DRUMS"
role = "drums"
# Gen Purpose Kit since 2026-09-17, found by ADR-028's exploration: the Set held it while
# this line still said Dry Session Kit, and nothing checked.
instrument = "Gen Purpose Kit"
armed = false
# Where this kit keeps the toms. The band writes the General MIDI notes in
# `theory/percussion.py`; the Dry Session Kit laid its four toms one piece lower and kept a
# ride where the band writes its high tom, and the Gen Purpose Kit has the same layout. Read
# off the kit's own pads, not guessed. An empty table means the two already agree.
pitches = { 50 = 47, 47 = 45, 45 = 43, 43 = 41 }

[[track]]
index = 1
name = "BASS"
role = "bass"
instrument = "Electric Bass Raw"
armed = false

[[track]]
index = 2
name = "GTR"
role = "guitar"
# Core Library's palm-muted Strat, driven by Lite's Saturator, with EQ Three's high band
# down to stand in for a cabinet (ADR-028, amended 2026-10-11: Kontakt Player and Stratus
# were dropped). A crunch tone, panned left. One sample, so no articulation split.
instrument = "Guitar Electric Muted"
armed = false

[[track]]
index = 3
name = "GTR 2"
role = "guitar_double"
# The second guitar (ADR-028): GTR duplicated, with a heavier Saturator preset, panned
# right. Silent below a chorus.
instrument = "Guitar Electric Muted"
armed = false

[[track]]
index = 4
name = "KEYS"
role = "keys"
# An organ (ADR-028): a B-3 from Arturia's Analog Lab, or Drift's "Organ Analog" if Analog
# Lab's licence does not open one — then this line says "Organ Analog".
instrument = "Analog Lab"
armed = false

[[track]]
index = 5
name = "LEAD"
role = "lead"
# Core Library, Simpler-based, so every edition of Live can load it. A clean electric
# against the rhythm guitars: the hook has to come through the band.
instrument = "Guitar Electric Clean"
armed = false

# Two scenes minimum: ADR-001 writes into the one that is not playing, so with a single
# scene there is nowhere safe to write. The other six are ADR-022's layout for cues from the
# MiniLab: material a pad can fire is written ahead into scenes nothing else writes to.
# `scripts/jam.py` finds the chorus candidate by its name here.
[[scene]]
index = 0
name = "A"

[[scene]]
index = 1
name = "B"

[[scene]]
index = 2
name = "CHORUS"

[[scene]]
index = 3
name = "BRIDGE"

[[scene]]
index = 4
name = "STOP A"

[[scene]]
index = 5
name = "STOP B"

[[scene]]
index = 6
name = "FILL A"

[[scene]]
index = 7
name = "FILL B"
